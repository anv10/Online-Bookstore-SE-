<text x="40" y="1229" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#193a5a">DESIGN AND DEPLOYMENT NOTES</text>
<text x="40" y="1260" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#193a5a">* Proposed design additions: reservations, payment attempts, durable jobs and retry processing.</text>
<text x="40" y="1288" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#193a5a">Scale application instances with shared sessions and coordinated SQL updates; routing / hosting remain to be selected.</text>
