{% extends 'base.html' %}
{% block content %}
<h1>Enter your reset code</h1>
<p>If a reset email was sent, it contains a six digit code. Enter it here to choose a new password.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button>Continue</button>
</form>
<p><a href="{% url 'password_reset' %}">Request another code</a></p>
{% endblock %}
