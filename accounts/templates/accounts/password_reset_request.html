{% extends 'base.html' %}
{% block content %}
<div class="auth">
  <div class="panel">
    <h2>Reset your password</h2>
    <form method="post">
      {% csrf_token %}
      <p>
        {{ form.identifier.label_tag }}
        {{ form.identifier }}
        {{ form.identifier.errors }}
      </p>
      <button class="button">Send reset link</button>
    </form>
    <p><a href="{% url 'login' %}">Back to log in</a></p>
  </div>
</div>
{% endblock %}
